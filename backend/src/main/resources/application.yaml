spring:
  application:
    name: country-explorer
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: false
      show-details: never
      show-components: never

app:
  rest-countries:
    base-url: ${REST_COUNTRIES_BASE_URL:https://api.restcountries.com/countries/v5}
    api-key: ${REST_COUNTRIES_API_KEY:}
    connect-timeout: ${REST_COUNTRIES_CONNECT_TIMEOUT:2s}
    read-timeout: ${REST_COUNTRIES_READ_TIMEOUT:5s}
  country-cache:
    catalogue-ttl: ${COUNTRY_CATALOG_TTL:24h}
    details-ttl: ${COUNTRY_DETAILS_TTL:24h}
    details-maximum-size: ${COUNTRY_DETAILS_MAXIMUM_SIZE:300}

# PostgreSQL error detail can include row values. Keep failures sanitized by the API handler.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
